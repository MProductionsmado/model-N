  # Configuration for Minecraft 3D Asset Generator
# =============================================
# Structure: Global defaults + Size-specific overrides
# Usage: python train.py --size normal (uses sizes.normal config)

# =============================================================================
# DATA SETTINGS (shared across all sizes)
# =============================================================================
data:
  input_dir: "out"
  output_dir: "data"
  processed_dir: "data/processed"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  random_seed: 42

# =============================================================================
# GLOBAL MODEL DEFAULTS
# These are used unless overridden in size-specific config
# =============================================================================
model:
  # Text encoder (shared - same for all sizes)
  text_encoder:
    model_name: "all-MiniLM-L6-v2"
    embedding_dim: 384
  
  # Default encoder settings (can be overridden per size)
  encoder:
    channels: [64, 128, 256, 512]
    kernel_size: 4
    stride: 2
    padding: 1
  
  # Default diffusion settings (can be overridden per size)
  diffusion:
    num_timesteps: 1000
    noise_schedule: "cosine"
    beta_start: 0.0001
    beta_end: 0.02
    time_embed_dim: 256
    num_res_blocks: 2
    attention_levels: [2, 3]
    dropout: 0.1
    sampling_steps: 50

  # =========================================================================
  # SIZE-SPECIFIC CONFIGURATIONS
  # Optimized for RTX 4090 (24GB VRAM) + 41GB RAM + 8 vCPU
  # =========================================================================
  sizes:
    # ----- NORMAL: Small structures (bushes, small rocks) -----
    # DIMENSIONS: 16x16x16 (4,096 voxels)
    # VRAM USE: ~8-10 GB with batch 64 (Better Learning)
    normal:
      dims: [16, 16, 16]
      latent_dim: 128
      encoder:
        channels: [64, 128, 256, 512] # Standard channels ok for small size
      diffusion:
        num_res_blocks: 2
        attention_levels: [1, 2, 3]   # Full attention for quality
        sampling_steps: 50
      training:
        batch_size: 64                # Reduced from 192 (Updates: 20/epoch vs 7/epoch)
        learning_rate: 0.0001
        accumulate_grad_batches: 1
        num_epochs: 200

    # ----- BIG: Standard trees, small houses -----
    # DIMENSIONS: 16x32x16 (8,192 voxels)
    # VRAM USE: Medium (~10-14 GB)
    big:
      dims: [16, 32, 16]
      latent_dim: 192
      encoder:
        channels: [64, 128, 256, 512]
      diffusion:
        num_res_blocks: 3              # More depth for vertical structures
        attention_levels: [2, 3]       # Attention only at lower resolutions
        sampling_steps: 75
      training:
        batch_size: 24                 # Max out 24GB VRAM
        learning_rate: 0.00008
        accumulate_grad_batches: 2     # Effective batch = 48
        num_epochs: 300

    # ----- HUGE: Giant trees, complex builds -----
    # DIMENSIONS: 24x64x24 (36,864 voxels)
    # VRAM USE: High (~20-23 GB) - LIMIT!
    huge:
      dims: [24, 64, 24]
      latent_dim: 256
      encoder:
        channels: [64, 128, 256, 384]  # Reduced last channel to save ~2GB VRAM
      diffusion:
        num_res_blocks: 3
        attention_levels: [3]          # Attn ONLY at bottleneck (critical for VRAM)
        sampling_steps: 100
      training:
        batch_size: 4                  # Keep low to prevent OOM
        learning_rate: 0.00005
        accumulate_grad_batches: 8     # Effective batch = 32
        num_epochs: 500

# =============================================================================
# GLOBAL TRAINING DEFAULTS
# Used if not overridden in sizes.{size}.training
# =============================================================================
training:
  batch_size: 8
  num_epochs: 300
  learning_rate: 0.00005
  weight_decay: 0.00001
  num_workers: 8      # Increased (was 4) - use all 8 vCPU for data loading
  accumulate_grad_batches: 1
  
  optimizer: "adam"
  scheduler: "cosine"
  warmup_epochs: 10
  
  save_every_n_epochs: 10
  checkpoint_dir: "models"
  
  early_stopping:
    enabled: true
    patience: 75
    monitor: "val/loss"
    
  log_dir: "logs"
  log_every_n_steps: 1  # Set to 1 for small datasets (<20 batches)

# =============================================================================
# GENERATION SETTINGS
# =============================================================================
generation:
  num_samples: 1
  temperature: 1.0
  guidance_scale: 1.0

# =============================================================================
# HARDWARE SETTINGS
# =============================================================================
hardware:
  device: "cuda"
  num_workers: 4        # Optimized for 8 vCPU
  precision: "16-mixed" # 16-mixed is safer than bf16 for some PyTorch versions, but switch to bf16-mixed if possible
  num_gpus: 1

# =============================================================================
# BLOCK VOCABULARY (shared across all sizes)
# =============================================================================
blocks:
    air: 0
    oak_leaves: 1  # Count: 513,807
    birch_leaves: 2  # Count: 122,651
    jungle_leaves: 3  # Count: 114,375
    spruce_leaves: 4  # Count: 103,554
    oak_wood: 5  # Count: 86,032
    snow: 6  # Count: 60,163
    tall_grass: 7  # Count: 58,464
    birch_wood: 8  # Count: 51,290
    light_gray_concrete: 9  # Count: 40,949
    spruce_wood: 10  # Count: 39,180
